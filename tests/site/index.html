<!doctype html><html><head><title>Negozio di prova</title></head><body>
<div id="cookie-banner" style="position:fixed;bottom:0;background:#eee;padding:10px">Usiamo i cookie. <button onclick="this.parentNode.remove()">Accetta tutto</button> <button onclick="this.parentNode.remove();document.title='Cookie rifiutati'">Rifiuta tutto</button></div>
<h1>Negozio</h1>
<form action="/cerca" id="search">
<label for="q">Cerca</label><input id="q" name="q"><button type="submit">Cerca</button></form>
<p id="r"></p>
<form><label>Email <input type="email" name="email"></label><label>Password <input type="password" name="pw"></label></form>
<button onclick="alert('comprato')">Acquista ora</button>
<a href="/check.html">Area protetta</a>
<p id="diag"></p>
<script>
  document.getElementById('search').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('r').textContent = 'Risultati per: ' + this.q.value;
  });
</script>
<script>
  var n = +(sessionStorage.loads || 0) + 1; sessionStorage.loads = n;
  var nav = (performance.getEntriesByType('navigation')[0] || {}).type;
  document.getElementById('diag').textContent = 'Diag loads=' + n + ' nav=' + nav + ' search=' + location.search +
    ' submits=' + (sessionStorage.submits || 0);
  document.addEventListener('submit', function (e) {
    sessionStorage.submits = +(sessionStorage.submits || 0) + 1;
    sessionStorage.lastSubmit = (e.target.getAttribute('action') || '(none)') + ' prevented=' + e.defaultPrevented;
  }, true);
  if (sessionStorage.lastSubmit) document.getElementById('diag').textContent += ' last=' + sessionStorage.lastSubmit;
</script>
</body></html>
